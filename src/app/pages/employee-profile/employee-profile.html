<app-navbar></app-navbar>

<div class="container mt-4">

  <div class="card shadow">

    <div class="card-header bg-primary text-white">

      <h3>My Profile</h3>

    </div>

    <div class="card-body">

      <div class="text-center mb-4">

        <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" width="120">

      </div>

      <form #profileForm="ngForm" (ngSubmit)="saveProfile()">

        <div class="row">

          <div class="col-md-6 mb-3">

            <label>Name</label>

            <input type="text" class="form-control" name="fullName" required [(ngModel)]="employee.fullName"
              #fullName="ngModel">

            <small class="text-danger" *ngIf="
             fullName.invalid &&
             fullName.touched">

              Name Required

            </small>

          </div>

          <div class="col-md-6 mb-3">

            <label>Email</label>

            <input type="email" class="form-control" name="email" required email [(ngModel)]="employee.email"
              #email="ngModel">

            <small class="text-danger" *ngIf="
             email.invalid &&
             email.touched">

              Valid Email Required

            </small>

          </div>

          <div class="col-md-6 mb-3">

            <label>Phone</label>

            <input type="text" class="form-control" name="phone" required [(ngModel)]="employee.phone">

          </div>

          <div class="col-md-6 mb-3">

            <label>Department</label>

            <input class="form-control" disabled [(ngModel)]="employee.department" name="department">

          </div>

          <div class="col-md-6 mb-3">

            <label>Designation</label>

            <input class="form-control" disabled [(ngModel)]="employee.designation" name="designation">

          </div>

          <div class="col-md-6 mb-3">

            <label>Joining Date</label>

            <input type="date" class="form-control" disabled [(ngModel)]="employee.joiningDate" name="joiningDate">

          </div>

          <div class="col-md-6 mb-3">

            <label>Employment Type</label>

            <input class="form-control" disabled [(ngModel)]="employee.employmentType" name="employmentType">

          </div>

          <div class="col-md-6 mb-3">

            <label>Gender</label>

            <input class="form-control" [(ngModel)]="employee.gender" name="gender">

          </div>

        </div>

        <button class="btn btn-success" [disabled]="profileForm.invalid">

          Save Profile

        </button>

      </form>

    </div>

  </div>

</div>
