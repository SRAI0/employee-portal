<app-navbar></app-navbar>

<div class="container mt-4">

  <div class="d-flex justify-content-between mb-3">
    <h2>Employees</h2>
    <a routerLink="/admin/employees/add" class="btn btn-success">
      Add Employee
    </a>
  </div>

  <!-- 👈 ADDED THE SEARCH INPUT BOX HERE -->
  <input 
    type="text"
    class="form-control mb-3" 
    placeholder="Search Employee..." 
    [(ngModel)]="searchText">

  <table class="table table-bordered table-hover">

    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Department</th>
        <th>Designation</th>
        <th>Salary</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <!-- Fixed the broken loop tr tag here -->
      <tr *ngFor="let emp of employees | employeeSearch:searchText">

        <td>{{emp.id}}</td>
        <td>{{emp.fullName}}</td>
        <td>{{emp.email}}</td>
        <td>{{emp.department}}</td>
        <td>{{emp.designation}}</td>
        <td>{{ emp.salary | salary }}</td>

        <td>
          <button 
            class="btn btn-warning btn-sm me-2" 
            (click)="editEmployee(emp.id)">
            Edit
          </button>
          <button 
            class="btn btn-danger btn-sm" 
            (click)="deleteEmployee(emp.id)">
            Delete
          </button>
          <button 
            class="btn btn-info btn-sm me-2" 
            (click)="viewEmployee(emp)"> 
              View 
          </button>
        </td>

      </tr>
    </tbody>

  </table>
  <app-employee-details 
    *ngIf="selectedEmployee" 
    [employee]="selectedEmployee" 
    (editEmployee)="editEmployee($event)" 
    (deleteEmployee)="deleteEmployee($event)" 
    (closeDetails)="closeDetails()"> 
  </app-employee-details>

  <app-confirm-dialog
    *ngIf="showDialog"
    title="Delete Employee"
    message="Are you sure you want to delete this employee?"
    (confirmed)="confirmDelete()"
    (cancelled)="cancelDelete()">
  </app-confirm-dialog>
</div>
