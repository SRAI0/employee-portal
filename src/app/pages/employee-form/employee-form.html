<app-navbar></app-navbar>

<div class="container mt-4">

    <h2>
        {{isEdit ? 'Edit Employee' : 'Add Employee'}}
    </h2>

    <form [formGroup]="employeeForm" (ngSubmit)="saveEmployee()">

        <div class="row">

            <div class="col-md-6 mb-3">
                <label>ID</label>
                <input class="form-control" formControlName="id">
            </div>

            <div class="col-md-6 mb-3">
                <label>Name</label>
                <input class="form-control" formControlName="fullName">
            </div>

            <div class="col-md-6 mb-3">
                <label>Email</label>
                <input class="form-control" formControlName="email">
            </div>

            <div class="col-md-6 mb-3">
                <label>Phone</label>
                <input class="form-control" formControlName="phone">
            </div>

            <div class="col-md-6 mb-3">
                <label>Gender</label>
                <select class="form-select" formControlName="gender">

                    <option>Male</option>
                    <option>Female</option>

                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label>Department</label>
                <input class="form-control" formControlName="department">
            </div>

            <div class="col-md-6 mb-3">
                <label>Designation</label>
                <input class="form-control" formControlName="designation">
            </div>

            <div class="col-md-6 mb-3">
                <label>Salary</label>
                <input type="number" class="form-control" formControlName="salary">
            </div>

            <div class="col-md-6 mb-3">
                <label>Joining Date</label>
                <input type="date" class="form-control" formControlName="joiningDate">
            </div>

            <div class="col-md-6 mb-3">
                <label>Employment Type</label>
                <select class="form-select" formControlName="employmentType">

                    <option>Permanent</option>
                    <option>Contract</option>

                </select>

            </div>

            <div class="col-md-6 mb-3">
                <label>Status</label>

                <select class="form-select" formControlName="status">

                    <option>Active</option>
                    <option>Inactive</option>

                </select>

            </div>

        </div>

        <button class="btn btn-primary">

            Save Employee

        </button>

    </form>

</div>
